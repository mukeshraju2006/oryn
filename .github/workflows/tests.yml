name: Oryn checks

on:
  push:
    branches:
      - main
      - "fix/**"
      - "modern-desktop"
  pull_request:
  workflow_dispatch:

jobs:
  python-checks:
    name: Python checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          python -m pip-audit -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q oryn gui server test_path_mapping.py test_cloud.py test_browser.py test_gui_launch.py test_snapshot_numbering.py test_qt_app.py test_auth_validation.py

      - name: Run non-GUI regression tests
        run: python -m pytest -q test_path_mapping.py test_snapshot_numbering.py test_qt_app.py test_auth_validation.py
