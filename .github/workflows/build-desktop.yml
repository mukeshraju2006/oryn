name: Build Oryn Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt pyinstaller
      - name: Package Oryn
        run: |
          pyinstaller --noconfirm --clean --windowed --name Oryn --icon assets/oryn-icon.ico --add-data "assets/oryn-icon.ico;assets" --add-data "assets/oryn-icon.png;assets" oryn/__main__.py
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        run: |
          iscc installer/Oryn.iss
      - uses: actions/upload-artifact@v4
        with:
          name: Oryn-Windows-x64
          path: dist/installer/Oryn-Setup.exe

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 libxcb-shape0 libxcb-sync1 libxcb-xkb1 libfontconfig1 fuse
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt pyinstaller
      - name: Package executable
        run: |
          pyinstaller --noconfirm --clean --windowed --name Oryn --icon assets/oryn-icon.png --add-data "assets/oryn-icon.png:assets" --add-data "assets/oryn-icon.ico:assets" oryn/__main__.py
      - name: Create AppDir
        run: |
          mkdir -p Oryn.AppDir/usr/bin Oryn.AppDir/usr/share/icons/hicolor/512x512/apps
          cp -r dist/Oryn Oryn.AppDir/usr/bin/
          cp assets/oryn-icon.png Oryn.AppDir/usr/share/icons/hicolor/512x512/apps/oryn.png
          cat > Oryn.AppDir/oryn.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Oryn
          Exec=Oryn
          Icon=oryn
          Categories=Utility;Development;
          Terminal=false
          EOF
          cat > Oryn.AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/Oryn/Oryn" "$@"
          EOF
          chmod +x Oryn.AppDir/AppRun
          cp assets/oryn-icon.png Oryn.AppDir/oryn.png
      - name: Download appimagetool
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
      - name: Build AppImage
        run: |
          ARCH=x86_64 ./appimagetool Oryn.AppDir Oryn-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: Oryn-Linux-x86_64
          path: Oryn-x86_64.AppImage

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/Oryn-Windows-x64/Oryn-Setup.exe
            release-assets/Oryn-Linux-x86_64/Oryn-x86_64.AppImage
